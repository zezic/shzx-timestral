name: Reference models

on: workflow_dispatch

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Timestral-5M
            filter: 5m
            revision: bdd20cfc15a3fea0e4cb5ccef37f8d3ca7aa335f
          - model: Timestral-28M
            filter: 28m
            revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
          - model: Timestral-123M
            filter: 123m
            revision: 5a147287addda85f6acd8da3fb8858fe9af7e8f7
          - model: Timestral-209M
            filter: 209m
            revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Download pinned checkpoint
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          REVISION: ${{ matrix.revision }}
        run: |
          mkdir -p "models/$MODEL"
          for file in config.json model.safetensors LICENSE; do
            curl --fail --location --retry 3 "https://huggingface.co/mistralai/$MODEL/resolve/$REVISION/$file" --output "models/$MODEL/$file"
          done
      - name: Compare native and named forecasts with reference
        run: cargo test --release --locked --test parity ${{ matrix.filter }} -- --ignored --test-threads=1
        env:
          TIMESTRAL_5M_DIR: models/Timestral-5M
          TIMESTRAL_28M_DIR: models/Timestral-28M
          TIMESTRAL_123M_DIR: models/Timestral-123M
          TIMESTRAL_209M_DIR: models/Timestral-209M
